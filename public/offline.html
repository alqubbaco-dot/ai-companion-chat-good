<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14106f" />
    <title>القبة — بدون نت</title>
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f8;
        --card: #ffffff;
        --ink: #1b1530;
        --muted: #6b6880;
        --line: #dcdbe6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #120f1f;
          --card: #1c1830;
          --ink: #f2f1f7;
          --muted: #a9a6bb;
          --line: #2e2945;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: radial-gradient(ellipse at top, rgba(140, 70, 240, 0.25), transparent 60%), var(--bg);
        color: var(--ink);
        font-family: "Cairo", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 32px 24px;
        box-shadow: 0 20px 50px rgba(20, 16, 111, 0.15);
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 30%;
        box-shadow: 0 10px 30px rgba(20, 16, 111, 0.35);
        animation: nap 2.4s ease-in-out infinite;
      }
      @keyframes nap {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(4deg) translateY(2px); }
      }
      h1 { font-size: 22px; margin: 20px 0 6px; }
      p { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.7; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font: inherit;
        font-weight: 700;
        font-size: 15px;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #22b6f0, #9b3cf0);
        box-shadow: 0 8px 20px rgba(155, 60, 240, 0.35);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/logo.webp" alt="القبة" />
      <h1>النت راح 😴</h1>
      <p>القبة غفت لحد ما يرجع الاتصال.<br />تأكد من الواي فاي أو البيانات وجرّب مرة ثانية.</p>
      <button type="button" onclick="location.reload()">جرّب مرة ثانية</button>
    </main>
    <script>
      // أول ما يرجع النت نرجع للتطبيق تلقائياً
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
