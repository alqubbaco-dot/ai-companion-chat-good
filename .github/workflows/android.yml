name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "::notice::Signing with the private release key"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - using the public test key"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleGithubRelease bundlePlayRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # إذا فشل البناء: نطلّع سبب الخطأ كملاحظة تنقرأ من GitHub
      - name: Report build error
        if: failure()
        working-directory: android
        run: |
          msg=$(grep -E "error:|What went wrong|e: |Could not|FAILED|failed" -A4 build.log | grep -v "^--$" | head -70 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build failed::${msg}"

      # qubba.apk = للتنصيب المباشر (يحدّث نفسه)، qubba-play.aab = للرفع على Google Play
      - name: Rename outputs
        run: |
          cp android/app/build/outputs/apk/github/release/app-github-release.apk qubba.apk
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab qubba-play.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: تطبيق أندرويد — نسخة ${{ github.run_number }}
          body: نزّل ملف qubba.apk على تلفون أندرويد ونصّبه.
          make_latest: true
          files: |
            qubba.apk
            qubba-play.aab
