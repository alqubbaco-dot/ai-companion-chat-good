plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
// المفتاح السري يجي من GitHub Secrets (ما ينحفظ بالمستودع)
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_PATH')
def releasePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')

android {
    namespace 'com.alqubba.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.alqubba.app'
        minSdk 24
        targetSdk 36
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    buildFeatures {
        buildConfig true
    }

    // نسختين: github = اللي تنزل من GitHub وتحدّث نفسها (إعلانات تجريبية)
    //         play   = نسخة Google Play (بدون تحديث ذاتي، وإعلانات حقيقية)
    flavorDimensions 'store'
    productFlavors {
        github {
            dimension 'store'
            buildConfigField 'boolean', 'SELF_UPDATE', 'true'
            buildConfigField 'boolean', 'ADS_TEST_MODE', 'true'
        }
        play {
            dimension 'store'
            buildConfigField 'boolean', 'SELF_UPDATE', 'false'
            buildConfigField 'boolean', 'ADS_TEST_MODE', 'false'
        }
    }

    signingConfigs {
        shared {
            if (releaseKeystore && releasePassword) {
                storeFile file(releaseKeystore)
                storePassword releasePassword
                keyAlias 'ghabiy-release'
                keyPassword releasePassword
            } else {
                // مفتاح التجربة القديم (بس إذا السر مو موجود)
                storeFile file('ghabiy-debug.keystore')
                storePassword 'ghabiy123'
                keyAlias 'ghabiy'
                keyPassword 'ghabiy123'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
